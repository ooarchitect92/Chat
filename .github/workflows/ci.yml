name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  frontend:
    name: Frontend quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: 22.12.0, cache: npm}
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend:
    name: Backend quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run: {working-directory: backend}
    env:
      APP_ENV: test
      DATABASE_URL: sqlite+aiosqlite:///./northstar-test.db
      JWT_SECRET: ci-only-secret-with-at-least-32-characters
      ALLOW_DETERMINISTIC_EMBEDDINGS: "true"
      RATE_LIMIT_FAIL_OPEN: "true"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: "3.12"}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --all-groups --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest --cov=src/northstar_api --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: error
          retention-days: 14

  configuration:
    name: Deployment configuration gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false}
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: kubectl kustomize kubernetes/base > /tmp/northstar.yaml
      - name: Reject mutable production image tags
        run: |
          if grep -Eq 'image: .*:(latest|main|master)$' /tmp/northstar.yaml; then
            echo 'Mutable image tag found in Kubernetes manifests' >&2
            exit 1
          fi
      - name: Validate Kubernetes manifests
        run: |
          KUBECONFORM_VERSION=0.7.0
          curl --fail --silent --show-error --location \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            --output /tmp/kubeconform.tar.gz
          echo 'c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3  /tmp/kubeconform.tar.gz' | sha256sum --check
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          /tmp/kubeconform -strict -summary /tmp/northstar.yaml

  security:
    name: Source and secret security gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: "true"
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false}
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with: {fail-on-severity: high}

  integration:
    name: Production topology integration gate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    needs: [frontend, backend, configuration, security]
    env:
      WEB_PORT: "3100"
      API_PORT: "8100"
      POSTGRES_PORT: "55432"
      REDIS_PORT: "6399"
      RABBITMQ_PORT: "5673"
      RABBITMQ_MANAGEMENT_PORT: "15673"
      KAFKA_HOST_PORT: "29093"
      MINIO_API_PORT: "9010"
      MINIO_CONSOLE_PORT: "9011"
      WEB_CSP_EXTRA_CONNECT_SRC: http://localhost:9010
      WEB_URL: http://localhost:3100
      API_URL: http://localhost:8100
      OBJECT_STORE_URL: http://localhost:9010
      SMOKE_WEB_ORIGIN: http://localhost:3100
      SMOKE_ADMIN_EMAIL: admin@example.com
      SMOKE_ADMIN_PASSWORD: change-me-before-first-run
      SMOKE_TIMEOUT_SECONDS: "300"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false}
      - run: cp .env.example .env
      - name: Build all application workloads
        run: docker compose build web api migrate worker job-dispatcher outbox-relay analytics-consumer object-cleaner
      - name: Scan runtime API image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: northstar/api:local
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan runtime web image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: northstar/web:local
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Start complete topology
        run: docker compose up --detach --no-build
      - name: Run end-to-end smoke checks
        run: bash scripts/smoke.sh
      - name: Verify migration head
        run: docker compose exec -T api alembic current | grep -q '0004_whatsapp_per_agent (head)'
      - name: Capture diagnostic logs
        if: always()
        run: docker compose logs --no-color > compose.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: compose-integration-logs
          path: compose.log
          if-no-files-found: error
          retention-days: 14
      - name: Stop topology
        if: always()
        run: docker compose down --volumes --remove-orphans
