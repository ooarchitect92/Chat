apiVersion: batch/v1
kind: Job
metadata: {name: northstar-migrate, namespace: northstar}
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001}
      containers:
        - name: migrate
          image: northstar/api:replace-with-immutable-tag
          command: [alembic, upgrade, head]
          envFrom: [{configMapRef: {name: northstar-config}}, {secretRef: {name: northstar-secrets}}]
          env: [{name: DATABASE_URL, valueFrom: {secretKeyRef: {name: northstar-secrets, key: MIGRATION_DATABASE_URL}}}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
